name: Automated Trading Bot

on:
  schedule:
    # Morning: Market Open (9:30 AM ET / 2:30 PM UTC)
    - cron: '30 14 * * 1-5'
    # Lunch: Midday Check (12:00 PM ET / 5:00 PM UTC)
    - cron: '0 17 * * 1-5'
    # Evening: Before Market Close (4:00 PM ET / 9:00 PM UTC)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  trading:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alpaca-py google-genai requests
    
    - name: Debug - Show environment variables (masked)
      run: |
        echo "Checking if secrets are loaded..."
        if [ -z "${{ secrets.ALPACA_API_KEY }}" ]; then
          echo "❌ ALPACA_API_KEY is empty or not set"
        else
          echo "✅ ALPACA_API_KEY is set (length: ${#ALPACA_API_KEY})"
        fi
        
        if [ -z "${{ secrets.ALPACA_SECRET }}" ]; then
          echo " ALPACA_SECRET is empty or not set"
        else
          echo "✅ ALPACA_SECRET is set (length: ${#ALPACA_SECRET})"
        fi
        
        if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "❌ GEMINI_API_KEY is empty or not set"
        else
          echo "✅ GEMINI_API_KEY is set"
        fi
        
        if [ -z "${{ secrets.NTFY_URL }}" ]; then
          echo "❌ NTFY_URL is empty or not set"
        else
          echo "✅ NTFY_URL is set"
        fi
        
        if [ -z "${{ secrets.STOCK_LIST }}" ]; then
          echo "❌ STOCK_LIST is empty or not set"
        else
          echo "✅ STOCK_LIST is set: ${{ secrets.STOCK_LIST }}"
        fi
    
    - name: Run Trading Bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NTFY_URL: ${{ secrets.NTFY_URL }}
        STOCK_LIST: ${{ secrets.STOCK_LIST }}
      run: python trading_bot.py
    
    - name: Notify if failed
      if: failure()
      env:
        NTFY_URL: ${{ secrets.NTFY_URL }}
      run: |
        curl -d "Trading bot execution failed - check GitHub Actions logs" \
          -H "Title: ❌ Trading Bot Failed" \
          -H "Priority: 5" \
          -H "Tags: error" \
          ${{ secrets.NTFY_URL }}
